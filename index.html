<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teman Menstruasi Remaja</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <header>
    <h1>🌸 Teman Menstruasi Remaja</h1>
    <p>Teman sehat untuk memahami menstruasi</p>
  </header>

  <main>

    <section class="welcome">
      <h2>Halo, Remaja Putri! 💕</h2>
      <p>
        Yuk kenali menstruasi, jaga kebersihan,
        dan pahami kesehatan reproduksi kamu.
      </p>
    </section>

    <section class="menu">

      <button onclick="showPage('menstruasi')">
        🩸
        <strong>Kenali Menstruasi</strong>
      </button>

      <button onclick="showPage('hygiene')">
        🧼
        <strong>Personal Hygiene</strong>
      </button>

      <button onclick="showPage('nyeri')">
        😣
        <strong>Nyeri Haid</strong>
      </button>

      <button onclick="showPage('nutrisi')">
        🍎
        <strong>Nutrisi</strong>
      </button>

      <button onclick="showPage('mitos')">
        ❓
        <strong>Mitos & Fakta</strong>
      </button>

      <button onclick="showPage('kuis')">
        📝
        <strong>Kuis</strong>
      </button>

    </section>

    <section id="content">
      <h2>Selamat Datang 🌷</h2>
      <p>
        Pilih salah satu menu di atas untuk mulai belajar
        tentang menstruasi.
      </p>
    </section>

  </main>

  <footer>
    <p>© 2026 Teman Menstruasi Remaja</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
